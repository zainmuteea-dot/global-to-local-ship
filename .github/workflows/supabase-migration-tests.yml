name: Supabase migration tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/test-store-image-migration.sh'
      - 'docs/store-image-migration-test.md'
      - '.github/workflows/supabase-migration-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/test-store-image-migration.sh'
      - 'docs/store-image-migration-test.md'
      - '.github/workflows/supabase-migration-tests.yml'

permissions:
  contents: read

concurrency:
  group: supabase-migration-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-image-migration:
    name: Store image and marketplace migrations (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Test migration in an isolated local Supabase project
        run: bash scripts/test-store-image-migration.sh
